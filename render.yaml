version: "1"
projects:
- name: Task Organizer
  environments:
  - name: Production

    services:
    - type: web
      name: task-organizer
      runtime: static
      repo: https://github.com/mimi26/task-organizer
      envVars:
      - key: NODE_VERSION
        sync: false
      buildCommand: yarn --frozen-lockfile install; yarn build
      staticPublishPath: build
      autoDeployTrigger: commit
      rootDir: client
      routes:
      - type: rewrite
        source: /*
        destination: /index.html

    - type: web
      name: task-organizer-api
      runtime: node
      repo: https://github.com/mimi26/task-organizer
      plan: free
      envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task_organizer_db
          property: connectionString
      - key: ALLOWED_ORIGIN
        value: https://to-do-qn9w.onrender.com
      - key: NODE_ENV
        sync: false
      - key: SESSION_KEY
        sync: false
      region: oregon
      buildCommand: yarn --frozen-lockfile install
      startCommand: node server.js
      autoDeployTrigger: commit

    databases:
    - name: task_organizer_db
      databaseName: task_organizer_db_v3gy
      user: task_organizer_db_v3gy_user
      plan: free
      region: oregon
      ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
      postgresMajorVersion: "18"

