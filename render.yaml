projects:
  - name: task-organizer
    environments:
      - name: production
        databases:
          - name: task_organizer_db
            plan: free

        services:
          - type: web
            runtime: static
            name: task-organizer
            buildCommand: yarn; yarn build
            staticPublishPath: build
            routes:
              - type: rewrite
                source: /*
                destination: /index.html

          - type: web
            name: task-organizer-api
            runtime: node
            plan: free
            buildCommand: yarn
            startCommand: yarn start
            envVars:
              - key: ALLOWED_ORIGIN
                value: https://task-organizer.onrender.com
              - key: DATABASE_URL
                fromDatabase:
                  name: task_organizer_db
                  property: connectionString
